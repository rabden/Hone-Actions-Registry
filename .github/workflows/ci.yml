name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate format & registry consistency
        run: node scripts/validate.js

      - name: Check for deletions of others' actions
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAINTAINERS: ${{ vars.REGISTRY_MAINTAINERS || 'rabden' }}
        run: |
          git show "${BASE_SHA}:registry.json" > /tmp/base-registry.json
          node scripts/check-deletions.js /tmp/base-registry.json registry.json
